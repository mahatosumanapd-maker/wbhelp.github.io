<!-- POST DETAILS MODAL -->

<div id="postModal" class="modal-overlay">

  <div class="post-modal">

    <button class="modal-close" onclick="closePostModal()">×</button>

    <div id="modalContent" class="modal-content"></div>

  </div>

</div>


<script>

const API_URL =
  "https://wbhelp-admin-server.mahatosumanapd.workers.dev";

const admitCardGrid =
  document.getElementById("admitCardGrid");


// ===============================
// LOAD ADMIT CARD POSTS
// ===============================

async function loadAdmitCards(){

  try{

    const response =
      await fetch(API_URL + "/api/posts");

    if(!response.ok){
      throw new Error("API error");
    }

    const data =
      await response.json();

    let posts =
      Array.isArray(data.posts) ? data.posts : [];


    // প্রথমে Admit Card category খোঁজা
    let admitCards =
      posts.filter(post => {

        const category =
          String(post.category || "").toLowerCase();

        return (
          category.includes("admit") ||
          category.includes("hall ticket") ||
          category.includes("প্রবেশপত্র")
        );

      });


    // যদি exact category না পাওয়া যায়,
    // title দেখে Admit Card খোঁজা হবে
    if(admitCards.length === 0){

      admitCards =
        posts.filter(post => {

          const title =
            String(post.title || "").toLowerCase();

          const description =
            String(post.description || "").toLowerCase();

          return (
            title.includes("admit") ||
            title.includes("hall ticket") ||
            title.includes("প্রবেশপত্র") ||
            description.includes("admit card")
          );

        });

    }


    if(admitCards.length === 0){

      admitCardGrid.innerHTML = `
        <div class="empty-box card">

          <h3>কোনও Admit Card আপডেট পাওয়া যায়নি</h3>

          <p>
            Admin Panel থেকে Admit Card category-তে
            পোস্ট যোগ করলে এখানে automatically দেখা যাবে।
          </p>

        </div>
      `;

      return;

    }


    admitCardGrid.innerHTML =
      admitCards.map(post => createAdmitCard(post)).join("");


  }catch(error){

    console.error(error);

    admitCardGrid.innerHTML = `
      <div class="error-box card">

        <h3>Admit Card লোড করা যাচ্ছে না</h3>

        <p>
          কিছুক্ষণ পরে আবার চেষ্টা করুন।
        </p>

      </div>
    `;

  }

}


// ===============================
// CREATE CARD
// ===============================

function createAdmitCard(post){

  const id =
    String(post.id || "");

  const title =
    escapeHTML(post.title || "Admit Card Update");

  const description =
    escapeHTML(post.description || "");

  const category =
    escapeHTML(post.category || "Admit Card");

  const date =
    escapeHTML(post.date || "");


  const postUrl =
    window.location.origin +
    window.location.pathname +
    "?post=" +
    encodeURIComponent(id);


  return `

    <article class="result-card card dynamic-card">

      <span class="tag">
        ${category}
      </span>

      <h3>
        ${title}
      </h3>

      <div class="post-date">
        প্রকাশিত: ${date}
      </div>

      <p>
        ${description.substring(0,180)}
        ${description.length > 180 ? "..." : ""}
      </p>


      <div class="card-actions">

        <button
          class="btn btn-primary"
          onclick="openPostModal('${escapeAttribute(id)}')">
          Details
        </button>


        ${
          post.officialLink
          ?
          `
          <a
            class="btn btn-primary"
            href="${escapeAttribute(post.officialLink)}"
            target="_blank"
            rel="noopener">
            Official Link
          </a>
          `
          :
          ""
        }


        <button
          class="share-btn"
          onclick="shareWhatsApp('${escapeAttribute(postUrl)}','${escapeAttribute(title)}')">
          WhatsApp
        </button>

        <button
          class="share-btn"
          onclick="shareFacebook('${escapeAttribute(postUrl)}')">
          Facebook
        </button>

        <button
          class="share-btn"
          onclick="shareTelegram('${escapeAttribute(postUrl)}','${escapeAttribute(title)}')">
          Telegram
        </button>

        <button
          class="share-btn"
          onclick="copyPostLink('${escapeAttribute(postUrl)}')">
          Copy Link
        </button>

      </div>

    </article>

  `;

}


// ===============================
// OPEN POST MODAL
// ===============================

async function openPostModal(id){

  try{

    const response =
      await fetch(API_URL + "/api/posts");

    const data =
      await response.json();

    const posts =
      Array.isArray(data.posts) ? data.posts : [];

    const post =
      posts.find(
        item => String(item.id) === String(id)
      );


    if(!post){

      alert("Post পাওয়া যায়নি।");
      return;

    }


    const officialButton =
      post.officialLink
      ?
      `
      <a
        class="btn btn-primary"
        href="${escapeAttribute(post.officialLink)}"
        target="_blank"
        rel="noopener">
        Official Website / Apply
      </a>
      `
      :
      "";


    document.getElementById("modalContent").innerHTML = `

      <span class="tag">
        ${escapeHTML(post.category || "Admit Card")}
      </span>

      <h2>
        ${escapeHTML(post.title || "")}
      </h2>

      ${
        post.date
        ?
        `<div class="post-date">
          প্রকাশিত: ${escapeHTML(post.date)}
        </div>`
        :
        ""
      }


      ${
        post.description
        ?
        `
        <div class="detail-row">
          <strong>বিস্তারিত:</strong>
          ${formatText(post.description)}
        </div>
        `
        :
        ""
      }


      ${
        post.importantDates
        ?
        `
        <div class="detail-row">
          <strong>গুরুত্বপূর্ণ তারিখ:</strong>
          ${formatText(post.importantDates)}
        </div>
        `
        :
        ""
      }


      ${
        post.applicationFee
        ?
        `
        <div class="detail-row">
          <strong>আবেদন ফি:</strong>
          ${formatText(post.applicationFee)}
        </div>
        `
        :
        ""
      }


      ${
        post.ageLimit
        ?
        `
        <div class="detail-row">
          <strong>বয়সসীমা:</strong>
          ${formatText(post.ageLimit)}
        </div>
        `
        :
        ""
      }


      ${
        post.vacancyDetails
        ?
        `
        <div class="detail-row">
          <strong>পদ / Vacancy:</strong>
          ${formatText(post.vacancyDetails)}
        </div>
        `
        :
        ""
      }


      ${
        post.educationalQualification
        ?
        `
        <div class="detail-row">
          <strong>শিক্ষাগত যোগ্যতা:</strong>
          ${formatText(post.educationalQualification)}
        </div>
        `
        :
        ""
      }


      ${
        post.selectionProcess
        ?
        `
        <div class="detail-row">
          <strong>নির্বাচন প্রক্রিয়া:</strong>
          ${formatText(post.selectionProcess)}
        </div>
        `
        :
        ""
      }


      ${
        post.howToApply
        ?
        `
        <div class="detail-row">
          <strong>কীভাবে আবেদন / Download করবেন:</strong>
          ${formatText(post.howToApply)}
        </div>
        `
        :
        ""
      }


      ${
        post.otherDetails
        ?
        `
        <div class="detail-row">
          <strong>অন্যান্য তথ্য:</strong>
          ${formatText(post.otherDetails)}
        </div>
        `
        :
        ""
      }


      <div class="modal-buttons">

        ${officialButton}

      </div>

    `;


    document
      .getElementById("postModal")
      .classList.add("show");


    // URL-এ post ID যোগ করা
    const newUrl =
      window.location.pathname +
      "?post=" +
      encodeURIComponent(id);

    history.pushState({}, "", newUrl);


  }catch(error){

    console.error(error);

    alert("Post লোড করা যাচ্ছে না।");

  }

}


// ===============================
// CLOSE MODAL
// ===============================

function closePostModal(){

  document
    .getElementById("postModal")
    .classList.remove("show");


  // URL থেকে ?post= সরানো
  history.pushState(
    {},
    "",
    window.location.pathname
  );

}


// বাইরে click করলে modal বন্ধ
document
  .getElementById("postModal")
  .addEventListener("click", function(e){

    if(e.target === this){

      closePostModal();

    }

  });


// ===============================
// CHECK URL POST ID
// ===============================

function checkPostFromURL(){

  const params =
    new URLSearchParams(window.location.search);

  const postId =
    params.get("post");

  if(postId){

    setTimeout(
      () => openPostModal(postId),
      300
    );

  }

}


// ===============================
// SHARE FUNCTIONS
// ===============================

function shareWhatsApp(url,title){

  const shareUrl =
    "https://wa.me/?text=" +
    encodeURIComponent(title + "\n" + url);

  window.open(
    shareUrl,
    "_blank",
    "noopener"
  );

}


function shareFacebook(url){

  const shareUrl =
    "https://www.facebook.com/sharer/sharer.php?u=" +
    encodeURIComponent(url);

  window.open(
    shareUrl,
    "_blank",
    "noopener"
  );

}


function shareTelegram(url,title){

  const shareUrl =
    "https://t.me/share/url?url=" +
    encodeURIComponent(url) +
    "&text=" +
    encodeURIComponent(title);

  window.open(
    shareUrl,
    "_blank",
    "noopener"
  );

}


async function copyPostLink(url){

  try{

    await navigator.clipboard.writeText(url);

    alert("Post link copied!");

  }catch(error){

    prompt(
      "এই link-টি copy করুন:",
      url
    );

  }

}


// ===============================
// SECURITY / TEXT HELPERS
// ===============================

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return String(value)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/"/g,"&quot;");

}


function formatText(value){

  return escapeHTML(value)
    .replace(/\n/g,"<br>");

}


// ===============================
// START
// ===============================

loadAdmitCards();

checkPostFromURL();

</script>
