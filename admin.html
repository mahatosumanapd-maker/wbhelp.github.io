<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WB Help Admin Login</title>

  <meta name="robots" content="noindex,nofollow">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, "Noto Sans Bengali", sans-serif;
      background: linear-gradient(135deg, #0b63ce, #0f9d8a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,.20);
    }

    .logo {
      width: 62px;
      height: 62px;
      margin: 0 auto 15px;
      border-radius: 16px;
      background: linear-gradient(135deg, #0b63ce, #0f9d8a);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 24px;
      font-weight: 800;
    }

    h1 {
      text-align: center;
      margin: 0 0 5px;
      color: #17324d;
      font-size: 25px;
    }

    .subtitle {
      text-align: center;
      color: #63758a;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      color: #17324d;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dce5ee;
      border-radius: 11px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #0b63ce;
      box-shadow: 0 0 0 3px rgba(11,99,206,.10);
    }

    .login-btn {
      width: 100%;
      border: 0;
      padding: 13px;
      border-radius: 11px;
      background: #0b63ce;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #084b9d;
    }

    .error {
      display: none;
      margin-top: 15px;
      padding: 11px;
      border-radius: 9px;
      background: #fff0f0;
      color: #c62828;
      text-align: center;
      font-size: 13px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #0b63ce;
      font-size: 13px;
      text-decoration: none;
    }

    .warning {
      margin-top: 20px;
      padding: 11px;
      border-radius: 9px;
      background: #fff8e6;
      color: #795500;
      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">WB</div>

    <h1>WB Help Admin</h1>

    <div class="subtitle">
      Admin Panel Login
    </div>

    <form id="loginForm">

      <div class="field">
        <label for="username">Username</label>

        <input
          type="text"
          id="username"
          placeholder="Enter username"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="login-btn">
        🔐 Login
      </button>

    </form>

    <div id="errorMessage" class="error">
      Username অথবা Password ভুল।
    </div>

    <a class="back" href="index.html">
      ← Back to WB Help
    </a>

    <div class="warning">
      Admin pageটি public website-এর অংশ। আসল security-এর জন্য
      পরবর্তীতে secure authentication/backend যুক্ত করতে হবে।
    </div>

  </div>


<script>
document.getElementById("loginForm").addEventListener("submit", function(e) {

  e.preventDefault();

  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  /*
    DEMO LOGIN

    IMPORTANT:
    এটি এখন শুধু interface/demo।
    এখানে আসল password রাখা নিরাপদ নয়।

    পরের ধাপে আমরা secure authentication যুক্ত করব।
  */

  if (username === "admin" && password === "WBHelp@2026") {

    sessionStorage.setItem("wbhelp_admin_login", "true");

    window.location.href = "admin-dashboard.html";

  } else {

    const error = document.getElementById("errorMessage");

    error.style.display = "block";

    setTimeout(function() {
      error.style.display = "none";
    }, 3000);
  }

});
</script>

</body>
</html>
